services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sunu_tech_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in your environment}
    ports:
      - "5432:5432"
    volumes:
      - sunu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sunu_tech_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sunu_postgres_data:
